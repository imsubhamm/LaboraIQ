services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: laboraiq
      POSTGRES_USER: laboraiq
      POSTGRES_PASSWORD: laboraiq
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laboraiq"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./apps/api
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      DEV_AUTH_BYPASS: "true"
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  postgres_data:

